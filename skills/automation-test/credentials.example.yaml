# Copy to ~/.config/alpha/credentials/<project>.yaml and `chmod 600` it.
# NEVER put this file in a git repo.
#
# Only `local` and `dev` are read. Role names must match the "Role" column of
# the verify guide (case-insensitive). `url` is optional: it overrides the
# profile's URL for this machine (e.g. other ports); for `dev` it must keep the
# same host as the profile.

local:
  url: http://localhost:3000
  accounts:
    Admin:
      email: admin@example.test
      password: "change-me"
    Technician:
      email: tech@example.test
      password: "change-me"

dev:
  accounts:
    Admin:
      email: admin@example.test
      password: "change-me"
